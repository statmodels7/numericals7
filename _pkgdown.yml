url: https://statmodels7.github.io/numericals7

template:
  bootstrap: 5
  bslib:
    primary: "#0F2A3F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Numerical kernels for statistical modeling
  description: >
    The numerical layer of the statmodels7 toolkit, written once: the
    combinatorial enumerations a higher-order chain rule rests on, one
    stencil library, batched quadrature and series, and special functions.

navbar:
  structure:
    left:  [reference]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

reference:
- title: Enumerations
  desc: >
    The combinatorial objects a higher-order chain rule sums over, each in
    one copy so that an enumeration cannot disagree with itself.
  contents:
  - tuple_indices
  - set_partitions
  - compositions

- title: Finite differences
  desc: >
    One stencil library: weights from the Vandermonde system, offsets sized
    from order and accuracy, a balanced step, and an applicator that never
    composes lower-order differences.
  contents:
  - fd_weights
  - fd_offsets
  - fd_step
  - fd_derivative

- title: Quadrature and series
  desc: >
    Integrals and sums vectorized over the parameters: one matrix evaluation
    for many parameter values, adaptivity batched by row, and NA with a named
    row where the requested accuracy cannot be reached.
  contents:
  - quad_vec
  - series_vec
  - gauss_kronrod15

- title: Threads
  desc: >
    The thread policy of the toolkit, one object passed as an argument from
    the fit entry points down to the compiled kernels. The result does not
    depend on the count, bit for bit.
  contents:
  - n_threads
  - thread_count
  - worker_count
  - local_threads

- title: Special functions
  contents:
  - log_bessel_i
  - log_bessel_k
  - log_bessel_i_derivs
  - log_bessel_k_derivs
  - mills_ratio
  - owen_t
  - bessel_i_ratio
  - bessel_i_ratio_derivs
  - bessel_i_ratio_inverse
