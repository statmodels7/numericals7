url: https://statmodels7.github.io/numericals7

template:
  bootstrap: 5
  bslib:
    primary: "#0F2A3F"
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}

home:
  title: Numerical kernels for statistical modeling
  description: >
    The numerical layer of the statmodels7 toolkit: the combinatorial
    enumerations on which a higher-order chain rule rests, a library of
    finite-difference stencils, batched quadrature and series, special
    functions, and smoothers of the absolute value.

navbar:
  structure:
    left:  [reference]
    right: [search, book, statmodels7, github]
  components:
    book:
      text: book
      href: https://statmodels7.github.io/book/
    statmodels7:
      text: statmodels7
      href: https://statmodels7.github.io

reference:
- title: Enumerations
  desc: >
    The combinatorial objects over which a higher-order chain rule sums,
    defined once so that every package uses the same ordering.
  contents:
  - tuple_indices
  - set_partitions
  - compositions

- title: Finite differences
  desc: >
    Finite-difference stencils: weights from the Vandermonde system, offsets
    sized from the order and the accuracy, a step that balances truncation
    against rounding, and an applicator that never composes lower-order
    differences.
  contents:
  - fd_weights
  - fd_offsets
  - fd_step
  - fd_derivative

- title: Quadrature and series
  desc: >
    Integrals and sums vectorized over the parameters: one matrix evaluation
    for many parameter values, adaptivity batched by row, and NA with a
    warning for a row that does not reach the requested accuracy.
  contents:
  - quad_vec
  - series_vec
  - gauss_kronrod15

- title: Threads
  desc: >
    The thread policy of the toolkit, one object passed as an argument from
    the fit entry points down to the compiled kernels. Each kernel returns the
    same bits at any thread count.
  contents:
  - n_threads
  - thread_count
  - worker_count
  - local_threads

- title: Special functions
  contents:
  - log_bessel_i
  - log_bessel_k
  - bessel_k
  - log_bessel_i_derivs
  - log_bessel_k_derivs
  - mills_ratio
  - owen_t
  - student_t_cdf
  - bessel_i_ratio
  - bessel_i_ratios
  - bessel_i_ratio_d1
  - bessel_i_ratio_inverse
  - bessel_i_ratio_inverse_d1

- title: Smoothers of the absolute value
  desc: >
    A smooth replacement for the absolute value with its derivatives up to
    order five, from which the smooth sign, step and hinge follow by
    composition. A break-point term smoothed this way has a true Jacobian
    block, and the validator checks a user-written smoother.
  contents:
  - abs_smoother
  - smooth_probit
  - smooth_hyperbolic
  - smooth_quintic
  - smoother_deriv
  - smoother_width
  - smoother_width_floor
  - check_abs_smoother
